<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick PDF Editor - Free Online PDF Modifier</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; text-align: center; }
        .upload-zone { border: 2px dashed #3498db; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; background: #eef7fc; transition: 0.3s; }
        .upload-zone:hover { background: #e1f0fa; }
        .editor-panel { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        button, label.btn { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
        button:hover, label.btn:hover { background: #2980b9; }
        .pay-banner { display: none; background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 20px; border-radius: 8px; text-align: center; margin-top: 20px; }
        .pay-btn { background: #27ae60; margin-top: 10px; }
        .pay-btn:hover { background: #219653; }
        #timer { font-size: 24px; font-weight: bold; margin: 10px 0; color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 Quick PDF Editor</h1>
    <p style="text-align: center;">Edit lines, names, fonts, and colors instantly.</p>

    <!-- Upload Section -->
    <div class="upload-zone" id="dropzone">
        <label for="pdf-file" class="btn">Choose PDF File</label>
        <input type="file" id="pdf-file" accept=".pdf" style="display: none;">
        <p>or drag and drop your PDF here</p>
    </div>

    <!-- Simulated Editor Controls -->
    <div class="editor-panel" id="editor">
        <h3>Modify Content</h3>
        <div class="controls">
            <input type="text" id="findText" placeholder="Text to change (e.g., John)">
            <input type="text" id="replaceText" placeholder="New text (e.g., Rahul)">
            <input type="color" id="fontColor" title="Choose color">
            <select id="fontSize">
                <option value="12">12px</option>
                <option value="14">14px</option>
                <option value="16" selected>16px</option>
                <option value="20">20px</option>
            </select>
        </div>
        <button id="saveBtn">Apply Changes & Download</button>
    </div>

    <!-- 50-Minute Paywall Banner -->
    <div class="pay-banner" id="paywall">
        <h2>🔒 Daily Free Limit Reached!</h2>
        <p>You have used your 2 free edits. Please wait 50 minutes or bypass the timer immediately for just ₹2.</p>
        <div id="timer">50:00</div>
        <button class="pay-btn" onclick="simulatePayment()">Pay ₹2 via UPI to Edit Now</button>
    </div>
</div>

<script>
    // State Tracking
    let editsUsed = parseInt(localStorage.getItem('editsUsed')) || 0;
    let lastEditTime = localStorage.getItem('lastEditTime') || null;

    const fileInput = document.getElementById('pdf-file');
    const editor = document.getElementById('editor');
    const paywall = document.getElementById('paywall');
    const saveBtn = document.getElementById('saveBtn');

    // Handle File Upload Display
    fileInput.addEventListener('change', () => {
        if(fileInput.files.length > 0) {
            checkAccess();
        }
    });

    function checkAccess() {
        const now = new Date().getTime();
        
        // If 50 minutes (3,000,000 ms) have passed, reset the limit
        if (lastEditTime && (now - lastEditTime > 3000000)) {
            editsUsed = 0;
            localStorage.setItem('editsUsed', '0');
        }

        if (editsUsed >= 2) {
            editor.style.display = 'none';
            paywall.style.display = 'block';
            startTimer();
        } else {
            paywall.style.display = 'none';
            editor.style.display = 'block';
        }
    }

    // Process Download and track limits
    saveBtn.addEventListener('click', () => {
        editsUsed++;
        localStorage.setItem('editsUsed', editsUsed);
        localStorage.setItem('lastEditTime', new Date().getTime());
        
        alert("Success! Your modified PDF is downloading.");
        checkAccess();
    });

    // 50-Minute Countdown Timer
    function startTimer() {
        let duration = 50 * 60; // 50 minutes in seconds
        const timerDisplay = document.getElementById('timer');
        
        const interval = setInterval(() => {
            let minutes = Math.floor(duration / 60);
            let seconds = duration % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerDisplay.textContent = `${minutes}:${seconds}`;

            if (--duration < 0) {
                clearInterval(interval);
                editsUsed = 0;
                localStorage.setItem('editsUsed', '0');
                checkAccess();
            }
        }, 1000);
    }

    function simulatePayment() {
        alert("Redirecting to Razorpay UPI... (Simulated payment of ₹2 successful!)");
        editsUsed = 0;
        localStorage.setItem('editsUsed', '0');
        checkAccess();
    }
</script>
</body>
</html>
